name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Syntax check
        working-directory: backend
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci intentionally not used here: this lockfile has optional peer
      # deps (e.g. yaml/typescript, pulled in by react-scripts' toolchain,
      # unused by this plain-JS app) that drift between resolver runs and
      # make npm ci fail non-deterministically even with matching Node/npm.
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          REACT_APP_LIVEKIT_URL: wss://placeholder.livekit.cloud
          REACT_APP_BACKEND_URL: http://localhost:5000

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt
      - name: Syntax check
        working-directory: agent
        run: find . -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

  docker:
    name: Docker build${{ github.ref == 'refs/heads/main' && ' + push' || '' }}
    needs: [backend, frontend, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_LIVEKIT_URL=${{ vars.REACT_APP_LIVEKIT_URL || 'wss://your-project.livekit.cloud' }}
            REACT_APP_BACKEND_URL=${{ vars.REACT_APP_BACKEND_URL || 'http://localhost:5000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
